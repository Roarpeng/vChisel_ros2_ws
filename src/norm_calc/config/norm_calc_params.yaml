norm_calc:
  ros__parameters:
    # ==================== 区域与网格 ====================
    BOX_LEN: 0.05
    BOX_ROW: 4
    BOX_COLUMN: 6
    # 工作空间
    XMIN: -0.15
    XMAX: 0.15
    YMIN: -0.1
    YMAX: 0.1
    ZMIN: 0.2
    ZMAX: 0.8
    BORDER_WIDTH: 0.03
    
    # ==================== 预处理 ====================
    SEARCH_RADIUS: 0.02        # 法向估计半径（从0.015增加到0.02，放宽条件）
    SEARCH_NUM_TH: 20          # 离群点去除阈值（从30降低到20，放宽条件）

    # ==================== 平面优先策略参数 ====================
    # 平面判定：面积 > 1平方cm 且 曲率 < 0.035
    PLANE_AREA_TH: 0.0001      # 平面面积阈值（1平方cm = 0.0001平方米）
    PLANE_CURV_TH: 0.035       # 平面曲率阈值（< 0.035 认为平面）
    PLANE_NORM_TH: 0.95        # 平面法向阈值（cos(18°)≈0.95，要求非常垂直）
    PLANE_HOLE_DIST: 0.02      # 平面位置的避障距离（2cm）

    # ==================== 凹凸山腰策略参数 ====================
    # 山腰位置：凹凸不平时的最佳凿击位置
    PROTRUSION_TH: 0.02       # 凸起高度差阈值（2cm）
    TIP_CROP_RATIO: 0.05      # 切顶比例基准值（动态调整）
    BASE_CROP_RATIO: 0.10     # 切底比例（固定10%）
    MOUNTAIN_NORM_TH: 0.91    # 山腰法向阈值（cos(25°)≈0.91）
    MOUNTAIN_HOLE_DIST: 0.04  # 山腰避障距离（4cm）

    # ==================== 凹坑避让参数 ====================
    # 凹坑检测和避让
    HOLE_SAFE_DIST: 0.05      # 凹坑安全距离（5cm）
    ENABLE_HOLE_DIR_CHECK: true # 启用凹坑方向检查
    DEPRESSION_DIST: 0.03     # 低洼区域检测距离（3cm）
    MAX_SLOPE_ANGLE: 0.52     # 最大允许坡度（30度）
    SLOPE_CHECK_RADIUS: 0.02  # 坡度检查半径（2cm）

    # ==================== 防滑移参数 ====================
    # 防止电锤滑移
    MAX_NORMAL_Y: 0.1         # 最大法向Y分量（防止向右滑移）
    MAX_NORMAL_Z: 0.1         # 最大法向Z分量（防止向下滑移）

    # ==================== 评分权重 ====================
    HEIGHT_WEIGHT: 3.0         # 高度权重（山腰优先）
    CURV_WEIGHT: 5.0           # 曲率权重（平整度优先）
    ANGLE_WEIGHT: 12.0         # 法向角度权重（垂直度优先）
    CENTER_WEIGHT: 1.5         # 中心权重（降低）
    PLANE_BONUS: 5.0           # 平面奖励权重（平面优先）

    # ==================== 随机模式参数 ====================
    # 用于严格模式和宽松模式都失败时的备用策略
    RANDOM_OFFSET_RANGE: 0.02  # 随机位置偏移范围（米，默认2cm）
    RANDOM_ANGLE_RANGE: 0.14   # 随机法向角度范围（弧度，默认20°）

    # ==================== 局部平面拟合和高度残差参数 ====================
    # 用于拟合局部参考平面和计算高度残差，实现凸起优先和已削平区域自动降低优先级
    RESIDUAL_WEIGHT: 8.0       # 高度残差权重（凸起优先，已削平区域自动降低优先级）
    RANSAC_THRESHOLD: 0.008    # RANSAC平面拟合阈值（米，5mm）
    MIN_PLANE_POINTS: 30       # RANSAC平面拟合最小点数（确保平面拟合的可靠性）

    # 混合模式参数（用于8-15cm²之间的缓冲区）
    HYBRID_NORM_TH: 0.86      # 混合法向阈值（介于严格0.90和宽松0.82之间）
    HYBRID_HOLE_DIST: 0.0175  # 混合避障距离（介于0.02和0.015之间）
    HYBRID_CURV_TH: 0.085     # 混合曲率阈值（介于0.07和0.10之间）

    # ==================== 手眼标定矩阵 ====================
    # 相机坐标系到工具坐标系的 4x4 齐次变换矩阵
    # 格式：按行优先存储
    # 单位：位置为米（m），旋转为方向余弦矩阵
    hand_eye_calibration:
      # 第一行：[R11, R12, R13, Tx]
      row1: [0.002136129093849748, 0.0131617748027531, 0.9999110983665177,-0.3592755296727744]
      # 第二行：[R21, R22, R23, Ty]
      row2: [0.9998109504292265, -0.01935263737141502,-0.001881177444387261, -0.03444265988510906]
      # 第三行：[R31, R32, R33, Tz]
      row3: [0.01932615725645348,0.9997260840404296, -0.01320062630660779, -0.2227647594718163]
      # 第四行：[0, 0, 0, 1]
      row4: [0.0, 0.0, 0.0, 1.0]

    # 标定元数据
    calibration_metadata:
      date: "2026-01-05"
      marker_id: 123
      marker_size: 0.10  # 米
      data_count: 15  # 采集的数据组数
    